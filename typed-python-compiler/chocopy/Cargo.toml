[package]
name = "chocopy"
version = "0.1.0"
edition = "2024"

[lib]
name = "chocopy"
path = "src/lib.rs"

[[bin]]
name = "chocopy"
path = "src/main.rs"

[features]
default = ["native"]
native = ["dep:getopts", "dep:cc", "dep:object", "dep:gimli", "dep:rand"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.8", optional = true }
enum_dispatch = "0.3"
getopts = { version = "0.2", optional = true }
gimli = { version = "0.28", features = ["write"], default-features = false, optional = true }
object = { version = "0.32", features = ["write"], default-features = false, optional = true }
cc = { version = "1.0", optional = true }
once_cell = "1.3"
md-5 = "0.10"
