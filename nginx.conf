server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # .wasm is served as application/wasm by nginx's standard mime.types (needed for streaming compile)

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Hashed build assets never change: cache for a year
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else (HTML, version.json, the WASM compiler) revalidates, so deploys show up at once
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
